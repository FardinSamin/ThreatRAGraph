name: Research repo checks

on:
  push:
    branches: [main, "chore/**", "docs/**", "feature/**", "research/**", "import/**"]
  pull_request:

permissions:
  contents: read

jobs:
  preflight-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Falco YAML parser
        run: python -m pip install --disable-pip-version-check -r requirements-normalization.txt
      - name: Python unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Intake safety heuristics
        run: python scripts/preflight_import.py .
      - name: Validate draft research manifests (offline)
        run: python scripts/validate_research_manifests.py datasets/manifests/pilot.json datasets/cases/pilot.json
      - name: Audit available local source artifacts (candidate-only manifest)
        run: python scripts/audit_source_artifacts.py datasets/manifests/pilot.json --require-all
      - name: Preview historical B0 and G1 source snapshots (no write)
        run: python -m scripts.freeze_case_snapshots datasets/manifests/pilot.json datasets/cases/pilot.json
      - name: Check graph component compilation and CLI import
        run: |
          python -m compileall -q src scripts
          python -m scripts.project_case_graph --help

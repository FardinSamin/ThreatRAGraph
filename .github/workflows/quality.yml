name: Research repo checks

on:
  push:
    branches: [main, "chore/**", "docs/**", "feature/**", "research/**", "import/**"]
  pull_request:

permissions:
  contents: read

jobs:
  security-and-quality:
    name: Security, supply chain and Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned quality and audit tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install exact runtime dependencies without unrequested transitive packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements-normalization.txt
      - name: Check installed parser version pins
        run: python -m scripts.check_dependency_versions
      - name: Check environment package consistency
        run: python -m pip check
      - name: Ruff error, import and undefined-name checks
        run: python -m ruff check --select E4,E9,F src scripts tests
      - name: Scan tracked files for credential patterns and high entropy
        run: python -m scripts.check_secrets
      - name: Audit runtime package advisories (PyPI)
        run: python -m pip_audit -r requirements-normalization.txt --no-deps --strict --progress-spinner off

  original-runc-tag-witness:
    name: Original runc release Git tag bytes
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch only original signed upstream v1.1.12 tag (never execute fetched code)
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/runc-release.git"
          git -C "$RUNNER_TEMP/runc-release.git" fetch --no-tags --depth=1 https://github.com/opencontainers/runc.git '+refs/tags/v1.1.12:refs/tags/v1.1.12'
      - name: Preserve original tag object bytes and emit candidate-only receipt
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.acquire_runc_git_tag --git-repo "$RUNNER_TEMP/runc-release.git" --artifact-root "$RUNNER_TEMP/runc-private/source_versions/sha256" > "$RUNNER_TEMP/runc-tag-witness.json"
          cat "$RUNNER_TEMP/runc-tag-witness.json"
      - name: Verify original signed tag with historical pinned project keyring
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg
          python -m scripts.verify_runc_tag_signer --git-repo "$RUNNER_TEMP/runc-release.git" > "$RUNNER_TEMP/runc-signer-witness.json"
          cat "$RUNNER_TEMP/runc-signer-witness.json"
      - name: Retain signer cryptographic witness without source or keys
        uses: actions/upload-artifact@v4
        with:
          name: runc-v1-1-12-historical-signer-receipt
          path: ${{ runner.temp }}/runc-signer-witness.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain only non-secret hash receipt, not third-party source bytes
        uses: actions/upload-artifact@v4
        with:
          name: runc-v1-1-12-candidate-hash-receipt
          path: ${{ runner.temp }}/runc-tag-witness.json
          retention-days: 14
          if-no-files-found: error

  original-ghsa-compound-witness:
    name: Original pinned GHSA dual-field candidate receipt
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch only exact original January 2024 GHSA JSON (never execute)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 2 --max-time 30 --max-filesize 2097152 \
            --output "$RUNNER_TEMP/original-ghsa.json" \
            "https://raw.githubusercontent.com/github/advisory-database/02a8b9a4f9d305f0e028ef58f0dcf28f55bf10ae/advisories/github-reviewed/2024/01/GHSA-xr7r-f8xq-vfvv/GHSA-xr7r-f8xq-vfvv.json"
      - name: Verify pinned source SHA-256 and both structured field hashes, candidate-only
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.replay_original_ghsa_candidate \
            --input-file "$RUNNER_TEMP/original-ghsa.json" \
            > "$RUNNER_TEMP/original-ghsa-candidate-receipt.json"
          cat "$RUNNER_TEMP/original-ghsa-candidate-receipt.json"
      - name: Retain only safe hash and field-locator receipt (no source body)
        uses: actions/upload-artifact@v4
        with:
          name: original-ghsa-compound-candidate-receipt
          path: ${{ runner.temp }}/original-ghsa-candidate-receipt.json
          retention-days: 14
          if-no-files-found: error

  historical-chimaera-citation-witness:
    name: Pinned 2021/2022 Chimaera bibliography pointer receipts
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve only two pinned historical public Git bibliography files (never execute)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 2 --max-time 30 --max-filesize 614400 \
            --output "$RUNNER_TEMP/chimaera-reference-2021.md" \
            "https://raw.githubusercontent.com/Metarget/awesome-cloud-native-security/9d68fc3a1e7a3790b12d59a120fb78ea2dd2b8d1/README.md"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 2 --max-time 30 --max-filesize 614400 \
            --output "$RUNNER_TEMP/chimaera-reference-2022.txt" \
            "https://raw.githubusercontent.com/RealityNet/attack-coverage/a933255173c0d512f712e2cb81a2067aa99a75a7/20220505/attack_groups.txt"
      - name: Byte-verify exact original AT&T citation in historical bibliography blobs
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_historical_chimaera_bibliography \
            --witness cloud-native-reference-dec2021 \
            --raw-file "$RUNNER_TEMP/chimaera-reference-2021.md" \
            > "$RUNNER_TEMP/chimaera-citation-2021-receipt.json"
          python -m scripts.verify_historical_chimaera_bibliography \
            --witness mitre-reference-may2022 \
            --raw-file "$RUNNER_TEMP/chimaera-reference-2022.txt" \
            > "$RUNNER_TEMP/chimaera-citation-2022-receipt.json"
          cat "$RUNNER_TEMP/chimaera-citation-2021-receipt.json"
          cat "$RUNNER_TEMP/chimaera-citation-2022-receipt.json"
      - name: Retain only metadata-only bibliography pointers, not third-party article bodies
        uses: actions/upload-artifact@v4
        with:
          name: chimaera-2021-2022-historical-bibliography-receipts
          path: |
            ${{ runner.temp }}/chimaera-citation-2021-receipt.json
            ${{ runner.temp }}/chimaera-citation-2022-receipt.json
          retention-days: 14
          if-no-files-found: error

  historical-mitre-teamtnt-original:
    name: Original 2022 MITRE TeamTNT STIX object and citation discrepancy
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Acquire only pinned MITRE ATT&CK v12.1 original TeamTNT STIX JSON
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 2 --max-time 30 --max-filesize 98304 \
            --output "$RUNNER_TEMP/mitre-teamtnt-2022-original.json" \
            "https://raw.githubusercontent.com/mitre/cti/4cbf8cc4bdf2121ee987a23bfe5aac4fe4d2f5b1/enterprise-attack/intrusion-set/intrusion-set--35d1b3be-49d4-42f1-aaa6-ef159c880bca.json"
      - name: Byte-verify original Git blob and typed STIX actor plus Chimaera date conflict
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_original_mitre_teamtnt \
            --original-file "$RUNNER_TEMP/mitre-teamtnt-2022-original.json" \
            > "$RUNNER_TEMP/mitre-teamtnt-2022-original-receipt.json"
          cat "$RUNNER_TEMP/mitre-teamtnt-2022-original-receipt.json"
      - name: Retain metadata-only original MITRE candidate receipt, never STIX source body
        uses: actions/upload-artifact@v4
        with:
          name: mitre-original-2022-teamtnt-source-candidate-receipt
          path: ${{ runner.temp }}/mitre-teamtnt-2022-original-receipt.json
          retention-days: 14
          if-no-files-found: error

  original-2022-kissadog-cado-reference:
    name: Original December 2022 Cado article pointer Git bytes
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch two exact 2022 Securonix Git pointer objects without executing files
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 2 --max-time 30 --max-filesize 16384 \
            --output "$RUNNER_TEMP/cado-old-link-2022.txt" \
            "https://raw.githubusercontent.com/Securonix/AutonomousThreatSweeper/79b944c177a8640fb8f5396515daf2c249a43b15/New_Variant_of_Kiss_a_Dog_Cryptojacking_Campaign/References.txt"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 2 --max-time 30 --max-filesize 16384 \
            --output "$RUNNER_TEMP/cado-derived-iocs-2022.md" \
            "https://raw.githubusercontent.com/Securonix/AutonomousThreatSweeper/79b944c177a8640fb8f5396515daf2c249a43b15/New_Variant_of_Kiss_a_Dog_Cryptojacking_Campaign/README.md"
      - name: Verify exact Git object identities and Cado URL, derivative reference only
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_kissadog_cado_pointer \
            --reference-file "$RUNNER_TEMP/cado-old-link-2022.txt" \
            --ioc-file "$RUNNER_TEMP/cado-derived-iocs-2022.md" \
            > "$RUNNER_TEMP/kissadog-cado-derivative-pointer.json"
          cat "$RUNNER_TEMP/kissadog-cado-derivative-pointer.json"
      - name: Retain original-pointer hash-only receipt, not third-party source
        uses: actions/upload-artifact@v4
        with:
          name: kissadog-cado-2022-derivative-citation-receipt
          path: ${{ runner.temp }}/kissadog-cado-derivative-pointer.json
          retention-days: 14
          if-no-files-found: error

  cado-pointer-public-push-witness:
    name: GH Archive 2022 public-push witness for original Cado URL pointer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download single exact 2022 GH Archive public event hour (no code execution)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
            --retry 2 --max-time 150 --max-filesize 167772160 \
            --output "$RUNNER_TEMP/2022-12-23-11.json.gz" \
            "https://data.gharchive.org/2022-12-23-11.json.gz"
      - name: Fetch only historical Securonix Git commit/tree/blob objects (never run code)
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/kissadog-pointer-original.git"
          git -C "$RUNNER_TEMP/kissadog-pointer-original.git" fetch --no-tags --depth=1 \
            https://github.com/Securonix/AutonomousThreatSweeper.git \
            '+79b944c177a8640fb8f5396515daf2c249a43b15:refs/heads/historical'
      - name: Verify original hourly archive, matching event and full Git object tree/file paths
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_kissadog_cado_public_push \
            --archive "$RUNNER_TEMP/2022-12-23-11.json.gz" \
            --require-original \
            --git-repo "$RUNNER_TEMP/kissadog-pointer-original.git" \
            > "$RUNNER_TEMP/2022-cado-pointer-public-push.json"
          cat "$RUNNER_TEMP/2022-cado-pointer-public-push.json"
      - name: Retain metadata-only event receipt, never the public event archive
        uses: actions/upload-artifact@v4
        with:
          name: cado-original-link-2022-public-github-push-candidate
          path: ${{ runner.temp }}/2022-cado-pointer-public-push.json
          retention-days: 14
          if-no-files-found: error

  original-2022-campaign-archive-index-probe:
    name: Real Common Crawl CDX search for original 2022 campaign publisher pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Query real official historic Common Crawl CDX indexes (not article HTML)
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.probe_original_campaign_cdx \
            --targets cado-original-2022 \
            --collections CC-MAIN-2023-06 \
            > "$RUNNER_TEMP/p1e-historic-campaign-cdx-candidates.json"
          python - "$RUNNER_TEMP/p1e-historic-campaign-cdx-candidates.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fp:
              result = json.load(fp)
          print("official_cdx_queries=", result["query_count"])
          print("pre_cutoff_candidate_index_records=", result["candidate_record_count"])
          for row in result["candidate_metadata_rows"]:
              print("index_candidate:", row["target"], row["candidate_status"],
                    row["collection"], row["cdx_timestamp_declared_utc"],
                    "url=", row["observed_url"],
                    "filename=", row["archive_filename"],
                    "offset=", row["archive_offset"], "length=", row["archive_length"],
                    "digest=", row["archive_payload_digest"])
          for q in result["query_receipts"]:
              print("cdx_query:", q["target"], q["collection"], q["query_status"])
          assert result["research_ready"] is False
          PY
      - name: Retain only candidate index metadata, not unreviewed publisher article bodies
        uses: actions/upload-artifact@v4
        with:
          name: p1e-original-2022-primary-report-cdx-candidate-search
          path: ${{ runner.temp }}/p1e-historic-campaign-cdx-candidates.json
          retention-days: 14
          if-no-files-found: error

  original-cado-february-2023-warc-bytes:
    name: Real 2023-02-06 Cado original HTML WARC bytes and HTTP 206 receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch exact original Common Crawl historical 22387-byte member (no execution)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
            --retry 2 --max-time 65 --max-filesize 4194304 \
            --range 696857860-696880246 \
            --dump-header "$RUNNER_TEMP/cado-original-20230206-range-headers.txt" \
            --output "$RUNNER_TEMP/cado-original-20230206-member.warc.gz" \
            "https://data.commoncrawl.org/crawl-data/CC-MAIN-2023-06/segments/1674764500339.37/warc/CC-MAIN-20230206113934-20230206143934-00755.warc.gz"
      - name: Replay exact publisher URL, UTC cutoff, HTTP 206 byte range and original WARC/HTML digests
        shell: bash
        run: |
          set -euo pipefail
          if python -m scripts.replay_original_cado_20230206 \
              --warc-member "$RUNNER_TEMP/cado-original-20230206-member.warc.gz" \
              --range-headers "$RUNNER_TEMP/cado-original-20230206-range-headers.txt" \
              > "$RUNNER_TEMP/cado-original-20230206-historical-warc-hashes.json"; then
            cat "$RUNNER_TEMP/cado-original-20230206-historical-warc-hashes.json"
          else
            cat "$RUNNER_TEMP/cado-original-20230206-historical-warc-hashes.json"
            exit 2
          fi
      - name: Retain only original-Cado WARC metadata and hashes, never report HTML
        uses: actions/upload-artifact@v4
        with:
          name: cado-20230206-original-publisher-html-verified-candidate-receipt
          path: ${{ runner.temp }}/cado-original-20230206-historical-warc-hashes.json
          retention-days: 14
          if-no-files-found: error

  p1f-original-crowdstrike-targeted-discovery:
    name: P1f historical original CrowdStrike/CSA/Sysdig archive research candidates
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Investigate original pre-cutoff publisher archive indexes (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from scripts.probe_original_campaign_cdx import probe
          scopes = (
              ("crowdstrike-original-2022", "CC-MAIN-2023-06"),
              ("crowdstrike-csa-republication-2022", "CC-MAIN-2023-06"),
              ("sysdig-early-2023", "CC-MAIN-2023-07"),
              ("crowdstrike-original-2022", "CC-MAIN-2022-49"),
              ("crowdstrike-original-2022", "CC-MAIN-2023-07"),
          )
          results = []
          for target, collection in scopes:
              outcome = probe(targets=[target], collections=[collection])
              print("P1F_SCOPE", target, collection, flush=True)
              for q in outcome["query_receipts"]:
                  print("P1F_QUERY", json.dumps(q, sort_keys=True), flush=True)
              for row in outcome["candidate_metadata_rows"]:
                  print("P1F_CANDIDATE", json.dumps(row, sort_keys=True), flush=True)
              results.append(outcome)
          with open("/tmp/p1f-original-archive-cdx-receipts.json", "w", encoding="utf-8") as fp:
              json.dump(results, fp, indent=2, sort_keys=True)
          assert all(r["research_ready"] is False and r["source_version_approved"] is False
                     and r["original_article_body_recovered"] is False for r in results)
          PY
      - name: Retain research-index metadata only, never claimed source article text
        uses: actions/upload-artifact@v4
        with:
          name: p1f-crowdstrike-csa-sysdig-historical-index-leads
          path: /tmp/p1f-original-archive-cdx-receipts.json
          retention-days: 14
          if-no-files-found: error

  preflight-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned runtime format parsers without transitive dependencies
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements-normalization.txt
      - name: Verify installed runtime dependency versions
        run: python -m scripts.check_dependency_versions
      - name: Show interpreter and resolved parser versions
        run: |
          python --version
          python -m pip freeze
      - name: Validate real P1a candidate chronology without granting source approval
        run: python -m scripts.validate_case_screening
      - name: Signed release provenance CLI smoke (offline only)
        run: python -m scripts.verify_runc_release_witness --help
      - name: GHSA structured review-candidate CLI smoke (offline only)
        run: python -m scripts.extract_ghsa_candidates --help
      - name: GHSA compound candidate review CLI smoke (offline only)
        run: python -m scripts.review_ghsa_candidate --help
      - name: Original pinned GHSA replay CLI smoke (offline only)
        run: python -m scripts.replay_original_ghsa_candidate --help
      - name: Versioned approved-source compound case CLI smoke (offline only)
        run: python -m scripts.project_compound_case --help
      - name: Prospective G1-v2 campaign screening CLI smoke (offline only)
        run: python -m scripts.screen_candidate_method --help
      - name: SCARLETEEL campaign peer candidate-only screen (not research approval)
        run: python -m scripts.screen_candidate_method
      - name: Prior SCARLETEEL v1 screening remains reproducible
        run: python -m scripts.screen_candidate_method --screen datasets/case_screenings/scarleteel.json
      - name: Historical Chimaera bibliography verification CLI smoke (offline only)
        run: python -m scripts.verify_historical_chimaera_bibliography --help
      - name: Original 2022 MITRE TeamTNT STIX replay CLI smoke (offline only)
        run: python -m scripts.verify_original_mitre_teamtnt --help
      - name: GH Archive 2022 Securonix public push verifier CLI smoke (offline)
        run: python -m scripts.verify_kissadog_cado_public_push --help
      - name: Original 2022 campaign official Common Crawl CDX probe CLI smoke
        run: python -m scripts.probe_original_campaign_cdx --help
      - name: Real original 2023 Cado indexed WARC replay CLI smoke
        run: python -m scripts.replay_original_cado_20230206 --help
      - name: Original Dec 2022 Cado article pointer Git replay CLI smoke
        run: python -m scripts.verify_kissadog_cado_pointer --help
      - name: SCARLETEEL candidate-only same-peer Kiss-a-dog path check
        run: python -m scripts.screen_same_peer_candidate_path
      - name: Same-peer candidate path CLI smoke
        run: python -m scripts.screen_same_peer_candidate_path --help
      - name: Strict prospective original-report Common Crawl WARC intake CLI smoke (offline only)
        run: python -m scripts.verify_candidate_warc_capture --help
      - name: G1 paired graph-similarity CLI smoke (offline only)
        run: python -m scripts.profile_g1 --help
      - name: Candidate byte capture CLI interface smoke (no downloads or writes)
        run: python -m scripts.capture_candidate_snapshot --help
      - name: Python unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Intake safety heuristics
        run: python scripts/preflight_import.py .
      - name: Validate draft research manifests (offline)
        run: python scripts/validate_research_manifests.py datasets/manifests/pilot.json datasets/cases/pilot.json
      - name: Audit available local source artifacts (candidate-only manifest)
        run: python scripts/audit_source_artifacts.py datasets/manifests/pilot.json --require-all
      - name: Preview historical B0 and G1 source snapshots (no write)
        run: python -m scripts.freeze_case_snapshots datasets/manifests/pilot.json datasets/cases/pilot.json
      - name: Check graph component compilation and CLI import
        run: |
          python -m compileall -q src scripts
          python -m scripts.project_case_graph --help
          python -m scripts.profile_b0 --help
